fovea:
  world_bounds: [-100.0, 100.0, -100.0, 100.0] # [x_min, x_max, y_min, y_max]
  
  # Resolution Bands (distance in meters -> cell size in meters)
  bands:
    - range: 10.0
      resolution: 0.05
    - range: 25.0
      resolution: 0.10
    - range: 50.0
      resolution: 0.20
    - range: 75.0
      resolution: 0.35
    - range: 100.0
      resolution: 0.50

  speed_steering:
    enabled: true
    min_speed: 2.0
    max_speed: 30.0
    max_forward_shift: 25.0 # meters lead forward
    stretch_factor: 1.5

  micro_foveas:
    enabled: true
    radius: 3.0 # meters around target
    resolution: 0.05
    max_active_micro_foveas: 4
    cell_budget: 300000 # hard cap on total cells across grid

  temporal_fusion:
    decay_rate: 0.95
    confidence_threshold: 0.3
    max_log_odds: 4.0
    min_log_odds: -4.0
